<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>114寒假閱讀測驗成績產生器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .report-card {
            width: 210mm;
            min-height: 297mm;
            padding: 20mm;
            margin: 20px auto;
            background: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        @media print {
            @page {
                size: A4;
                margin: 0;
            }
            body {
                background-color: white;
                margin: 0;
                padding: 0;
            }
            .no-print { display: none; }
            .report-card {
                box-shadow: none;
                margin: 0;
                width: 210mm;
                height: 297mm;
                break-after: page;
                page-break-after: always;
            }
            .report-card:last-child {
                break-after: auto;
                page-break-after: auto;
            }
        }

        .filter-chip input:checked + span {
            background-color: #2563eb;
            color: white;
            border-color: #2563eb;
        }
    </style>
</head>
<body class="bg-gray-100 font-sans">

    <div class="no-print p-6 max-w-4xl mx-auto">
        <h1 class="text-2xl font-bold mb-4 text-blue-800">114寒假閱讀測驗成績產生器</h1>
        
        <div class="bg-white p-4 rounded-lg shadow-md mb-6">
            <div class="mb-4">
                <label class="block mb-2 font-semibold text-gray-700">方法 A：從 Google 試算表讀取 (發佈為 CSV)</label>
                <div class="flex gap-2">
                    <input type="text" id="sheetUrl" class="flex-1 p-2 border rounded" placeholder="https://docs.google.com/spreadsheets/d/.../pub?output=csv">
                    <button onclick="fetchFromUrl()" id="fetchBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded font-bold transition">讀取連結</button>
                </div>
            </div>

            <hr class="my-4">

            <label class="block mb-2 font-semibold text-gray-700">方法 B：貼上原始資料</label>
            <textarea id="rawData" class="w-full h-32 p-2 border rounded font-mono text-sm" placeholder="時間	班級	座號	姓名	卷名	分數" oninput="updateFilters()"></textarea>
            
            <!-- 補考處理與篩選區 -->
            <div id="filterSection" class="mt-4 p-4 bg-blue-50 rounded-lg border border-blue-100 hidden">
                <div class="mb-4 p-3 bg-white rounded border border-blue-200">
                    <label class="flex items-center cursor-pointer">
                        <input type="checkbox" id="overwriteRetest" class="w-4 h-4 text-blue-600" onchange="processData()" checked>
                        <span class="ml-2 font-bold text-gray-700">補考成績處理：若有補考，自動覆蓋原始成績 (需卷名開頭相同)</span>
                    </label>
                    <p class="text-xs text-gray-500 mt-1 ml-6">※ 註：補考項需命名為「原卷名 補考」（包含空格）。勾選後，原卷成績將不計入。</p>
                </div>

                <div class="flex justify-between items-center mb-2">
                    <span class="font-bold text-blue-800">請勾選要顯示的測驗項目：</span>
                    <div class="space-x-2">
                        <button onclick="selectAllFilters(true)" class="text-xs text-blue-600 underline">全選</button>
                        <button onclick="selectAllFilters(false)" class="text-xs text-blue-600 underline">全不選</button>
                    </div>
                </div>
                <div id="filterContainer" class="flex flex-wrap gap-2"></div>
            </div>

            <div class="mt-4 flex gap-2">
                <button onclick="processData()" class="bg-gray-800 hover:bg-black text-white px-6 py-2 rounded font-bold transition">產生個人成績單</button>
                <button onclick="window.print()" id="printBtn" class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded font-bold transition hidden">直接列印 (PDF)</button>
            </div>
        </div>
        <div id="statusMsg" class="text-sm font-bold mb-4"></div>
    </div>

    <div id="outputContainer"></div>

    <script>
        async function fetchFromUrl() {
            const url = document.getElementById('sheetUrl').value.trim();
            const statusMsg = document.getElementById('statusMsg');
            const fetchBtn = document.getElementById('fetchBtn');

            if (!url) {
                statusMsg.innerText = "請輸入連結";
                statusMsg.className = "text-sm font-bold text-red-600 mb-4";
                return;
            }

            try {
                statusMsg.innerText = "讀取中...";
                fetchBtn.disabled = true;
                const response = await fetch(url);
                if (!response.ok) throw new Error("讀取失敗，請確認連結");
                const csvData = await response.text();
                document.getElementById('rawData').value = csvData.replace(/,/g, '\t');
                updateFilters();
                statusMsg.innerText = "資料讀取成功。";
                statusMsg.className = "text-sm font-bold text-green-600 mb-4";
            } catch (err) {
                statusMsg.innerText = "錯誤：" + err.message;
                statusMsg.className = "text-sm font-bold text-red-600 mb-4";
            } finally {
                fetchBtn.disabled = false;
            }
        }

        function updateFilters() {
            const rawText = document.getElementById('rawData').value.trim();
            const filterSection = document.getElementById('filterSection');
            const filterContainer = document.getElementById('filterContainer');
            if (!rawText) { filterSection.classList.add('hidden'); return; }

            const lines = rawText.split('\n');
            const testSet = new Set();
            lines.forEach(line => {
                const parts = line.trim().split(/,|\t|\s{2,}/);
                if (parts.length >= 6 && !line.includes("時間")) {
                    testSet.add(parts[4].replace(/"/g, '').trim());
                }
            });

            if (testSet.size > 0) {
                filterSection.classList.remove('hidden');
                filterContainer.innerHTML = '';
                Array.from(testSet).sort().forEach(testName => {
                    filterContainer.innerHTML += `
                        <label class="filter-chip cursor-pointer">
                            <input type="checkbox" class="hidden test-filter-checkbox" value="${testName}" checked onchange="processData()">
                            <span class="px-3 py-1 border rounded-full text-sm border-gray-300 bg-white block hover:border-blue-400">
                                ${testName}
                            </span>
                        </label>
                    `;
                });
            }
        }

        function selectAllFilters(check) {
            document.querySelectorAll('.test-filter-checkbox').forEach(cb => cb.checked = check);
            processData();
        }

        function processData() {
            const rawText = document.getElementById('rawData').value.trim();
            if (!rawText) return;

            const selectedTests = Array.from(document.querySelectorAll('.test-filter-checkbox:checked')).map(cb => cb.value);
            const isOverwrite = document.getElementById('overwriteRetest').checked;
            
            const lines = rawText.split('\n');
            const students = {};

            // 第一次遍歷：收集所有資料
            lines.forEach(line => {
                const trimmedLine = line.trim();
                if (!trimmedLine || trimmedLine.includes("時間") || trimmedLine.includes("班級")) return;
                const parts = trimmedLine.split(/,|\t|\s{2,}/);
                if (parts.length >= 6) {
                    const classId = parts[1].replace(/"/g, '');
                    const seatNo = parseInt(parts[2].replace(/\D/g, ''), 10);
                    const name = parts[3].replace(/"/g, '');
                    const testName = parts[4].replace(/"/g, '').trim();
                    const score = parseInt(parts[5].replace(/[%\s"]/g, ''), 10);

                    if (!selectedTests.includes(testName)) return;

                    const key = `${classId}-${String(seatNo).padStart(3, '0')}-${name}`;
                    if (!students[key]) students[key] = { classId, seatNo, name, tests: {} };
                    if (!students[key].tests[testName]) students[key].tests[testName] = [];
                    students[key].tests[testName].push(score);
                }
            });

            // 處理補考覆蓋邏輯
            if (isOverwrite) {
                Object.values(students).forEach(s => {
                    const testNames = Object.keys(s.tests);
                    testNames.forEach(tName => {
                        if (tName.endsWith(" 補考")) {
                            const originalName = tName.replace(" 補考", "");
                            if (s.tests[originalName]) {
                                // 刪除原始成績，僅保留補考
                                delete s.tests[originalName];
                            }
                        }
                    });
                });
            }

            const sortedKeys = Object.keys(students).sort((a, b) => {
                const s1 = students[a];
                const s2 = students[b];
                if (s1.classId !== s2.classId) return s1.classId.localeCompare(s2.classId);
                return s1.seatNo - s2.seatNo;
            });

            renderReports(students, sortedKeys);
            document.getElementById('printBtn').classList.toggle('hidden', sortedKeys.length === 0);
        }

        function renderReports(students, keys) {
            const container = document.getElementById('outputContainer');
            container.innerHTML = '';
            if (keys.length === 0) {
                container.innerHTML = '<div class="text-center p-10 text-gray-500">尚無符合條件的資料</div>';
                return;
            }

            keys.forEach(key => {
                const s = students[key];
                let sumScores = 0;
                let tableRows = '';
                const testNames = Object.keys(s.tests).sort();

                testNames.forEach(tname => {
                    const scores = s.tests[tname];
                    let thisScore = 0;
                    let calcMethod = '';

                    if (tname.includes("系統停機")) {
                        calcMethod = "直接加總";
                        thisScore = scores.reduce((a, b) => a + b, 0);
                    } else {
                        calcMethod = "取平均值";
                        thisScore = scores.reduce((a, b) => a + b, 0) / scores.length;
                    }
                    sumScores += thisScore;

                    tableRows += `
                        <tr class="text-sm">
                            <td class="py-1.5 px-3 text-left border border-gray-400">${tname}</td>
                            <td class="py-1.5 px-3 border border-gray-400 text-center">${calcMethod}</td>
                            <td class="py-1.5 px-3 font-semibold border border-gray-400 text-center">${thisScore.toFixed(1)}</td>
                            <td class="py-1.5 px-3 border border-gray-400 text-center">${scores.length}次</td>
                        </tr>
                    `;
                });

                const initialAvg = sumScores / 10;
                let finalScore = initialAvg;
                let reductionCount = 0;
                while (finalScore > 100) {
                    finalScore /= 2;
                    reductionCount++;
                }

                const cardHtml = `
                    <div class="report-card">
                        <h1 class="text-3xl font-bold text-center mb-6">114寒假閱讀測驗學習成果報告</h1>
                        <div class="flex justify-between border-b-2 border-black pb-1 mb-4 font-bold text-lg">
                            <span>班級：${s.classId}</span>
                            <span>座號：${String(s.seatNo).padStart(2, '0')}</span>
                            <span>姓名：${s.name}</span>
                        </div>
                        <table class="w-full border-collapse border-2 border-gray-800 mb-6">
                            <thead>
                                <tr class="bg-gray-100 text-sm">
                                    <th class="border border-gray-400 py-2 px-3 text-left">測驗/項目名稱</th>
                                    <th class="border border-gray-400 py-2 px-3">計算方式</th>
                                    <th class="border border-gray-400 py-2 px-3">本項得分</th>
                                    <th class="border border-gray-400 py-2 px-3">次數</th>
                                </tr>
                            </thead>
                            <tbody>${tableRows}</tbody>
                        </table>
                        <div class="flex justify-between items-start mb-6">
                            <div class="space-y-1">
                                <h3 class="font-bold text-lg">【成績計算說明】</h3>
                                <ul class="text-sm space-y-1">
                                    <li>• 總得分 (僅包含勾選項)：<span class="font-mono">${sumScores.toFixed(1)}</span></li>
                                    <li>• 初始平均 (總分/10)：<span class="font-mono">${initialAvg.toFixed(2)}</span></li>
                                    ${reductionCount > 0 ? `<li class="text-red-600 font-bold">• 超額處理：經 ${reductionCount} 次折半校正至 100 以下</li>` : `<li>• 最終校正分數：${finalScore.toFixed(1)}</li>`}
                                </ul>
                            </div>
                            <div class="border-4 border-red-600 p-3 text-center w-40">
                                <div class="text-red-600 font-bold text-sm mb-1">最終成績</div>
                                <div class="text-4xl font-bold text-red-600">${finalScore.toFixed(1)}</div>
                            </div>
                        </div>
                        <div class="mt-auto flex gap-8">
                            <div class="flex-1">
                                <div class="font-bold mb-1 text-sm">教師評語：</div>
                                <div class="border-2 border-black h-24 w-full p-2"></div>
                            </div>
                            <div class="flex-1 flex flex-col justify-end pb-1">
                                <div class="font-bold text-right">家長簽名：________________</div>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHtml;
            });
        }
    </script>
</body>
</html>
